{% set d = s.datos %}
<section style="background:var(--paper); text-align:center; padding:6rem 5vw;">
  <span class="section-tag reveal">{{ ed(s, 'etiqueta', d.etiqueta) }}</span>
  <h2 class="section-title reveal">{{ ed(s, 'titulo_linea1', d.titulo_linea1) }}<br>{{ ed(s, 'titulo_linea2', d.titulo_linea2) }}</h2>
  <p class="section-sub reveal" style="margin:0 auto 2.5rem;">{{ ed(s, 'subtitulo', d.subtitulo) }}</p>
  <a href="{{ d.boton_link }}" class="btn-primary reveal"{{ ed_link(s, 'boton_link') }}>{{ ed(s, 'boton_texto', d.boton_texto) }}</a>
</section>
