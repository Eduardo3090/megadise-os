{% extends "admin/base_admin.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block bodyclass %}admin-acceso{% endblock %}
{% block contenido %}
<div class="admin-center-box">
    <div class="admin-card admin-login-card">
        <img src="{{ url_for('static', filename='logo megadisenos.png') }}" alt="Megadiseños" class="admin-login-logo">
        <p class="admin-eyebrow">Acceso privado</p>
        <h1>Crea una contraseña nueva</h1>
        <p class="admin-subtext">Al guardarla entrarás al panel, y cualquier otra sesión abierta se cerrará.</p>
        <form method="POST" action="{{ url_for('admin_restablecer', token=token) }}" class="admin-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="nueva">Contraseña nueva</label>
            <input type="password" id="nueva" name="nueva" required autocomplete="new-password" minlength="{{ min_password }}" placeholder="Mínimo {{ min_password }} caracteres" autofocus>

            <label for="nueva2">Repite la contraseña nueva</label>
            <input type="password" id="nueva2" name="nueva2" required autocomplete="new-password" minlength="{{ min_password }}">

            <button type="submit" class="admin-btn admin-btn-primary admin-btn-full">Guardar y entrar</button>
        </form>
    </div>
</div>
{% endblock %}
