{% extends "admin/base_admin.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="admin-center-box">
    <div class="admin-card admin-login-card">
        <img src="{{ url_for('static', filename='logo megadisenos.png') }}" alt="Megadiseños" class="admin-login-logo">
        <h1>Panel de edición</h1>
        <p class="admin-subtext">Inicia sesión para editar los textos e imágenes de tu sitio web.</p>
        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="siguiente" value="{{ siguiente or '' }}">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" required autocomplete="username" autofocus>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" class="admin-btn admin-btn-primary admin-btn-full">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
